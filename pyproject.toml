[project]
name = "opendaw-mcp"
version = "1.387.0"
description = "543 MCP tools for agent-native control of openDAW — a browser-based digital audio workstation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "daw", "music-production", "audio", "synth", "midi", "playwright", "opendaw", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "playwright>=1.40",
    "mcp>=1.27,<2",
    "uvicorn>=0.20",
]

[project.urls]
Homepage = "https://github.com/AMEBIUS-team/opendaw-mcp"
Documentation = "https://ameobius.github.io/opendaw-mcp/"
Repository = "https://github.com/AMEBIUS-team/opendaw-mcp"
Issues = "https://github.com/AMEBIUS-team/opendaw-mcp/issues"
Changelog = "https://ameobius.github.io/opendaw-mcp/changelog/"

[project.scripts]
opendaw-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
packages = ["opendaw_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E722", "W292"]
ignore = ["E501", "E701", "E702"]
