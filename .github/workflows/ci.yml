name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install mcp playwright pytest ruff
      - name: Python syntax check
        run: python -m py_compile server.py
      - name: AST tool count verification
        run: |
          python -c "
          import ast
          tree = ast.parse(open('server.py').read())
          tools = [n for n in ast.walk(tree) if isinstance(n, ast.AsyncFunctionDef) and n.name.startswith('mcp_opendaw_')]
          count = len(tools)
          print(f'MCP tools found: {count}')
          assert count >= 380, f'Expected at least 380 tools, got {count}'
          print(f'MCP tools found: {count} (threshold: 380)')
          print('Tool count verification passed!')
          "
      - name: Validate DSP scripts exist and syntax
        run: |
          for f in scripts/werkstatt_darksat.js scripts/werkstatt_waveshaper.js scripts/werkstatt_moog_ladder.js scripts/werkstatt_rotary_speaker.js scripts/werkstatt_convolution_reverb.js scripts/werkstatt_coldfold.js scripts/werkstatt_compressor.js scripts/werkstatt_paraeq.js scripts/werkstatt_limiter.js scripts/werkstatt_exciter.js scripts/werkstatt_deesser.js scripts/werkstatt_transient.js scripts/werkstatt_stereowidth.js scripts/werkstatt_vibrato.js scripts/werkstatt_bitcrusher.js scripts/werkstatt_spring_reverb.js scripts/werkstatt_tube_saturator.js scripts/werkstatt_tape_delay.js scripts/werkstatt_graphic_eq.js scripts/werkstatt_auto_pan.js scripts/werkstatt_comb_filter.js scripts/werkstatt_formant_filter.js scripts/werkstatt_harmonizer.js scripts/werkstatt_multiband_comp.js scripts/werkstatt_vocoder.js scripts/werkstatt_reverse.js scripts/werkstatt_scratch.js scripts/werkstatt_looper.js scripts/werkstatt_spectral_gate.js scripts/werkstatt_dynamic_eq.js scripts/apparat_darkbass.js scripts/apparat_coldlead.js scripts/apparat_subcrusher.js scripts/apparat_pluck.js scripts/apparat_wavetable.js scripts/apparat_supersaw.js scripts/spielwerk_arpeggiator.js scripts/spielwerk_powerchord.js scripts/spielwerk_scale_quantizer.js scripts/spielwerk_harmonizer.js scripts/werkstatt_multitap_delay.js scripts/werkstatt_dimension_chorus.js scripts/werkstatt_autowah.js scripts/werkstatt_octaver.js scripts/werkstatt_fuzz.js scripts/spielwerk_prob_gate.js scripts/spielwerk_chorder.js scripts/werkstatt_tape_stop.js scripts/werkstatt_multiband_imager.js scripts/werkstatt_gated_reverb.js scripts/werkstatt_reverse_delay.js scripts/werkstatt_freq_shifter.js scripts/werkstatt_bass_enhancer.js scripts/werkstatt_tilt_eq.js scripts/werkstatt_svf.js scripts/werkstatt_modal_resonator.js scripts/werkstatt_multiband_saturator.js scripts/werkstatt_vinyl.js scripts/werkstatt_grain_delay.js scripts/werkstatt_expander.js scripts/werkstatt_binaural.js scripts/werkstatt_harmonic_tremolo.js scripts/werkstatt_envelope_follower.js scripts/werkstatt_auto_wah.js scripts/werkstatt_spectral_compressor.js scripts/apparat_bowed_string.js scripts/werkstatt_auto_tune.js scripts/werkstatt_phase_vocoder.js scripts/werkstatt_time_stretch.js scripts/werkstatt_matching_eq.js scripts/werkstatt_spectral_denoise.js scripts/werkstatt_dereverb.js scripts/werkstatt_declicker.js scripts/werkstatt_decrackle.js scripts/werkstatt_phaser.js scripts/werkstatt_spectral_enhancer.js scripts/werkstatt_formant_shifter.js scripts/werkstatt_maximizer.js scripts/werkstatt_cabinet_sim.js scripts/werkstatt_valve_preamp.js scripts/werkstatt_synthetic_ir_reverb.js scripts/werkstatt_sidechain_comp.js scripts/werkstatt_ott.js scripts/werkstatt_soft_clipper.js scripts/werkstatt_plate_reverb.js scripts/werkstatt_ensemble.js scripts/werkstatt_cassette_sim.js scripts/werkstatt_adsr_trim.js scripts/werkstatt_allpass.js scripts/werkstatt_chorus.js scripts/werkstatt_dcremover.js scripts/werkstatt_de_plosive.js scripts/werkstatt_envfollower.js scripts/werkstatt_flanger.js scripts/werkstatt_glue_comp.js scripts/werkstatt_granular_stretch.js scripts/werkstatt_haas_widener.js scripts/werkstatt_karplus_strong.js scripts/werkstatt_lookahead.js scripts/werkstatt_mid_side_processor.js scripts/werkstatt_multifilter.js scripts/werkstatt_noisegate.js scripts/werkstatt_overdrive.js scripts/werkstatt_paulstretch.js scripts/werkstatt_pitch_shift.js scripts/werkstatt_reverb.js scripts/werkstatt_ringmod_env.js scripts/werkstatt_shimmer.js scripts/werkstatt_spectral_blur.js scripts/werkstatt_spectral_freezer.js scripts/werkstatt_stereo_delay.js scripts/werkstatt_tremolo.js scripts/werkstatt_vowel_morph.js scripts/werkstatt_waveguide_string.js scripts/werkstatt_analog_delay.js scripts/werkstatt_distortion_pedal.js scripts/werkstatt_tank_reverb.js scripts/werkstatt_bx_saturator.js scripts/werkstatt_nyquist_comp.js scripts/werkstatt_thermal_comp.js; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            node -c "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "All DSP scripts present and valid"
      - name: Check for hardcoded paths
        run: |
          if grep -r "/home/" server.py --include="*.py"; then
            echo "Found hardcoded /home/ paths in server.py!"
            exit 1
          fi
          echo "No hardcoded paths found"
      - name: Smoke test — server imports and tool registration
        run: |
          python -c "
          import server
          mcp = server.mcp
          import asyncio
          tools = asyncio.run(mcp.list_tools())
          print(f'Registered MCP tools: {len(tools)}')
          assert len(tools) >= 386, f'Expected >=385 registered tools, got {len(tools)}'
          tool_names = {t.name for t in tools}
          for required in ['mcp_opendaw_get_project_info', 'mcp_opendaw_create_synth_track', 'mcp_opendaw_add_effect', 'mcp_opendaw_export_mix', 'mcp_opendaw_transport']:
              assert required in tool_names, f'Missing required tool: {required}'
          print('Smoke test passed — all tools registered correctly')
          "
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
      - name: Lint with ruff
        run: |
          ruff check server.py
          echo "Ruff lint passed"
