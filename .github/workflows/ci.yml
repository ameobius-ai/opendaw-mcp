name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install mcp playwright pytest ruff
      - name: Python syntax check
        run: python -m py_compile server.py
      - name: AST tool count verification
        run: |
          python -c "
          import ast
          tree = ast.parse(open('server.py').read())
          tools = [n for n in ast.walk(tree) if isinstance(n, ast.AsyncFunctionDef) and n.name.startswith('mcp_opendaw_')]
          count = len(tools)
          print(f'MCP tools found: {count}')
          assert count >= 309, f'Expected at least 309 tools, got {count}'
          print('Tool count verification passed!')
          "
      - name: Validate DSP scripts exist and syntax
        run: |
          for f in scripts/werkstatt_darksat.js scripts/werkstatt_waveshaper.js scripts/werkstatt_moog_ladder.js scripts/werkstatt_rotary_speaker.js scripts/werkstatt_convolution_reverb.js scripts/werkstatt_coldfold.js scripts/werkstatt_compressor.js scripts/werkstatt_paraeq.js scripts/werkstatt_limiter.js scripts/werkstatt_exciter.js scripts/werkstatt_deesser.js scripts/werkstatt_transient.js scripts/werkstatt_stereowidth.js scripts/werkstatt_vibrato.js scripts/werkstatt_bitcrusher.js scripts/werkstatt_spring_reverb.js scripts/werkstatt_tube_saturator.js scripts/werkstatt_tape_delay.js scripts/werkstatt_graphic_eq.js scripts/werkstatt_auto_pan.js scripts/werkstatt_comb_filter.js scripts/werkstatt_formant_filter.js scripts/werkstatt_harmonizer.js scripts/werkstatt_multiband_comp.js scripts/werkstatt_vocoder.js scripts/werkstatt_reverse.js scripts/werkstatt_scratch.js scripts/werkstatt_looper.js scripts/werkstatt_spectral_gate.js scripts/werkstatt_dynamic_eq.js scripts/apparat_darkbass.js scripts/apparat_coldlead.js scripts/apparat_subcrusher.js scripts/apparat_pluck.js scripts/apparat_wavetable.js scripts/apparat_supersaw.js scripts/spielwerk_arpeggiator.js scripts/spielwerk_powerchord.js scripts/spielwerk_scale_quantizer.js scripts/spielwerk_harmonizer.js; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            node -c "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "All DSP scripts present and valid"
      - name: Check for hardcoded paths
        run: |
          if grep -r "/home/" server.py --include="*.py"; then
            echo "Found hardcoded /home/ paths in server.py!"
            exit 1
          fi
          echo "No hardcoded paths found"
      - name: Smoke test — server imports and tool registration
        run: |
          python -c "
          import server
          mcp = server.mcp
          import asyncio
          tools = asyncio.run(mcp.list_tools())
          print(f'Registered MCP tools: {len(tools)}')
          assert len(tools) >= 304, f'Expected >=298 registered tools, got {len(tools)}'
          tool_names = {t.name for t in tools}
          for required in ['mcp_opendaw_get_project_info', 'mcp_opendaw_create_synth_track', 'mcp_opendaw_add_effect', 'mcp_opendaw_export_mix', 'mcp_opendaw_transport']:
              assert required in tool_names, f'Missing required tool: {required}'
          print('Smoke test passed — all tools registered correctly')
          "
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
      - name: Lint with ruff
        run: |
          ruff check server.py
          echo "Ruff lint passed"
