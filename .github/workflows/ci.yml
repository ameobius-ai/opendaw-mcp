name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (push storms queue dozens otherwise)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write  # allow posting pytest failure logs to the tracking issue

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install "mcp>=1.27,<2" playwright pytest ruff numpy scipy pyloudnorm

      - name: Python syntax check
        run: python -m py_compile server.py

      - name: AST tool count verification
        run: |
          python -c "
          import ast
          tree = ast.parse(open('server.py').read())
          tools = [n for n in ast.walk(tree) if isinstance(n, ast.AsyncFunctionDef) and n.name.startswith('mcp_opendaw_')]
          count = len(tools)
          print(f'MCP tools found: {count}')
          assert count >= 520, f'Expected at least 520 tools, got {count}'
          print(f'MCP tools found: {count} (threshold: 520)')
          print('Tool count verification passed!')
          "

      - name: Validate DSP scripts exist and syntax
        run: |
          for f in $(find scripts -name '*.js'); do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            node -c "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "All DSP scripts present and valid"

      - name: Check for hardcoded paths
        run: |
          if grep -rn "/home/" server.py opendaw_mcp/ --include="*.py"; then
            echo "Found hardcoded /home/ paths!"
            exit 1
          fi
          echo "No hardcoded paths found"

      - name: Smoke test — server imports and tool registration
        run: |
          python -c "
          import server
          mcp = server.mcp
          import asyncio
          tools = asyncio.run(mcp.list_tools())
          print(f'Registered MCP tools: {len(tools)}')
          assert len(tools) >= 500, f'Expected >=500 registered tools, got {len(tools)}'
          tool_names = {t.name for t in tools}
          for required in ['mcp_opendaw_get_project_info', 'mcp_opendaw_create_synth_track', 'mcp_opendaw_add_effect', 'mcp_opendaw_export_mix', 'mcp_opendaw_transport']:
              assert required in tool_names, f'Missing required tool: {required}'
          print('Smoke test passed — all tools registered correctly')
          "

      - name: Run unit tests
        run: |
          python -m pytest tests/ -q --tb=short -rfE 2>&1 | tee /tmp/pytest.log

      - name: Comment pytest failure log on tracking issue
        if: failure() && matrix.python-version == '3.12'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "**CI diagnostic**: pytest failed on \`${{ github.sha }}\` (run #${{ github.run_number }}, python ${{ matrix.python-version }})."
            echo
            echo '<details><summary>pytest tail</summary>'
            echo
            echo '```'
            tail -n 150 /tmp/pytest.log
            echo '```'
            echo '</details>'
          } > /tmp/comment.md
          gh issue comment 16 --repo ameobius-ai/opendaw-mcp --body-file /tmp/comment.md

      - name: Repo consistency check
        run: python scripts/check_repo_consistency.py
      - name: Tool reference up-to-date
        run: |
          cp docs/tools/reference.md /tmp/ref_before.md
          python scripts/gen_tool_docs.py
          diff /tmp/ref_before.md docs/tools/reference.md || {
            echo "Tool reference is stale. Run: python scripts/gen_tool_docs.py"
            exit 1
          }
      - name: Lint with ruff
        run: |
          ruff check server.py opendaw_mcp tests/test_opendaw_mcp.py
          echo "Ruff lint passed"
      - name: Generate SBOM
        if: matrix.python-version == '3.11'
        run: |
          pip install pip-audit
          pip-audit --format json --output sbom.json || true
      - name: Upload SBOM
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 30
