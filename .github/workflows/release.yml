name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Job 1: Build and publish to PyPI (OIDC trusted publishing, no tokens)
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Job 2: Build and publish Docker image to GHCR
  publish-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ameobius/opendaw-mcp:latest
            ghcr.io/ameobius/opendaw-mcp:${{ steps.version.outputs.VERSION }}

  # Job 3: Create GitHub Release with notes
  github-release:
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s" -20)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          body: |
            ## ${{ steps.version.outputs.VERSION }}

            ### Changes
            ${{ steps.notes.outputs.notes }}

            ### Published to
            - **PyPI:** `pip install opendaw-mcp`
            - **GHCR:** `docker pull ghcr.io/ameobius/opendaw-mcp:${{ steps.version.outputs.VERSION }}`
            - **MCP Registry:** `io.github.AMEBIUS/opendaw-mcp`
          draft: false
          prerelease: false
