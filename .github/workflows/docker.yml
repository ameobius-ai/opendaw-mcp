name: Docker Build

# Build-only smoke check: the image was never built in CI, which let a broken
# Dockerfile (wrong upstream repo) land unnoticed. This builds the image on
# changes to the packaging files so build failures surface before merge.
# The smoke job additionally *runs* the image and asserts the static host
# (:5174) and the MCP server (:8080) come up — runtime breakage like a wrong
# entrypoint interpreter only shows up at container start (issue #37).

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "entrypoint.sh"
      - "requirements.txt"
      - "scripts/serve_static.py"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "entrypoint.sh"
      - "requirements.txt"
      - "scripts/serve_static.py"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image (no push)
        run: docker build -t opendaw-mcp:ci .

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t opendaw-mcp:ci .

      - name: Start container
        run: docker run -d --name smoke -p 5174:5174 -p 8080:8080 opendaw-mcp:ci

      - name: Wait for static host on :5174
        run: curl --retry 30 --retry-delay 1 --retry-connrefused -fsS -o /dev/null http://localhost:5174/

      - name: Assert MCP server responds on :8080
        run: |
          # any HTTP response (even 4xx) proves the server is up; 000 means connection refused
          code=$(curl --retry 30 --retry-delay 1 --retry-connrefused -s -o /dev/null -w '%{http_code}' http://localhost:8080/sse)
          echo "MCP /sse HTTP status: $code"
          if [ "$code" = "000" ]; then
            echo "MCP server did not come up on :8080"
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
