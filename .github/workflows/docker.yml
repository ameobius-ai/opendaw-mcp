name: Docker Build

# Build-only smoke check: the image was never built in CI, which let a broken
# Dockerfile (wrong upstream repo) land unnoticed. This builds the image on
# changes to the packaging files so build failures surface before merge.
# The smoke job additionally *runs* the image and asserts the static host
# (:5174) and the MCP server (:8080) come up — runtime breakage like a wrong
# entrypoint interpreter only shows up at container start (issue #37).

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "entrypoint.sh"
      - "requirements.txt"
      - "scripts/serve_static.py"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "entrypoint.sh"
      - "requirements.txt"
      - "scripts/serve_static.py"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # allow posting docker logs to the PR when smoke fails

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image (no push)
        run: docker build -t opendaw-mcp:ci .

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t opendaw-mcp:ci .

      - name: Start container
        run: |
          docker run -d --name smoke -p 5174:5174 -p 8080:8080 opendaw-mcp:ci
          sleep 5
          if ! docker ps --filter name=smoke --filter status=running -q | grep -q .; then
            echo "Container exited within 5s of start"
            docker logs smoke 2>&1 || true
            exit 1
          fi

      - name: Wait for static host on :5174
        run: |
          # any HTTP response (even 4xx) proves the server is up; 000 means connection refused
          code=$(curl --retry 60 --retry-delay 1 --retry-connrefused -s -o /dev/null -w '%{http_code}' http://localhost:5174/)
          echo "static host / HTTP status: $code"
          if [ "$code" = "000" ]; then
            echo "Static host did not come up on :5174"
            exit 1
          fi

      - name: Assert MCP server responds on :8080
        run: |
          # TCP probe: server.py is a 2.8 MB module — boot can take a while (see #15)
          ok=0
          for i in $(seq 1 120); do
            if timeout 1 bash -c 'echo > /dev/tcp/127.0.0.1/8080' 2>/dev/null; then
              ok=1
              echo "MCP port 8080 open after ~${i}s"
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "MCP server did not open :8080 within 120s"
            docker logs smoke 2>&1 || true
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke 2>&1 || true

      - name: Comment docker logs on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker logs smoke > /tmp/smoke.log 2>&1 || true
          {
            echo "**Container smoke failed** (run #${{ github.run_number }}). \`docker logs smoke\` tail:"
            echo
            echo '<details><summary>docker logs</summary>'
            echo
            echo '```'
            tail -n 80 /tmp/smoke.log
            echo '```'
            echo '</details>'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ameobius-ai/opendaw-mcp --body-file /tmp/comment.md

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
