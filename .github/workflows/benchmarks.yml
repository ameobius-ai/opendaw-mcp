name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 10:00 UTC
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The benchmark script imports server.py, which pulls in the full
          # runtime stack. requirements.txt alone is not enough — mirror the
          # package set ci.yml installs for its test job.
          pip install psutil numpy scipy pyloudnorm

      - name: Run benchmarks (lite mode)
        run: |
          python scripts/benchmark_performance.py --output benchmark_results_lite.json 2>&1 | tee bench_lite.log
        env:
          OPENDAW_MCP_MODE: lite

      - name: Run benchmarks (full mode)
        run: |
          python scripts/benchmark_performance.py --output benchmark_results_full.json 2>&1 | tee bench_full.log
        env:
          OPENDAW_MCP_MODE: full

      # Self-diagnostics: the job-logs endpoint is not always reachable via
      # API, so on failure post the captured output to the PR (same pattern
      # as ci.yml's pytest log tail). Gives the real traceback in one run.
      - name: Comment failure log on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### ❌ Benchmark job failed — captured output"
            echo '```'
            tail -n 100 bench_lite.log bench_full.log 2>/dev/null || echo "(no logs captured)"
            echo '```'
          } > bench_failure.md
          gh pr comment "$PR_NUMBER" --body-file bench_failure.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark_results_lite.json
            benchmark_results_full.json
            bench_lite.log
            bench_full.log
          retention-days: 90
          if-no-files-found: warn

      - name: Comment PR with results
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true  # advisory: a failed comment must not fail the job
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let liteResults, fullResults;
            try {
              liteResults = JSON.parse(fs.readFileSync('benchmark_results_lite.json', 'utf8'));
              fullResults = JSON.parse(fs.readFileSync('benchmark_results_full.json', 'utf8'));
            } catch (e) {
              console.log('Could not read benchmark results:', e.message);
              return;
            }

            const latestLite = liteResults[liteResults.length - 1];
            const latestFull = fullResults[fullResults.length - 1];

            const comment = `## 🚀 Performance Benchmarks

            ### Lite mode (default)
            | Metric | Value |
            |---|---|
            | Import time | ${latestLite.benchmarks.import_time_seconds}s |
            | Memory (peak) | ${latestLite.benchmarks.memory.peak_mb} MB |
            | Tools | ${latestLite.benchmarks.tool_count} |

            ### Full mode
            | Metric | Value |
            |---|---|
            | Import time | ${latestFull.benchmarks.import_time_seconds}s |
            | Memory (peak) | ${latestFull.benchmarks.memory.peak_mb} MB |
            | Tools | ${latestFull.benchmarks.tool_count} |

            ---
            *Automated benchmark run*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
