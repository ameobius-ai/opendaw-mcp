name: MCP Inspector Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  inspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opendaw-mcp
        run: pip install -e .

      - name: Install MCP Inspector
        run: npm install -g @modelcontextprotocol/inspector

      - name: Validate server starts and lists tools
        run: |
          # Start server in background, give it 3s to init
          timeout 10 python -c "
          import subprocess, json, time, sys

          # Start the MCP server
          proc = subprocess.Popen(
              ['python', '-m', 'opendaw_mcp'],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          time.sleep(3)

          # Send initialize request
          init_msg = json.dumps({
              'jsonrpc': '2.0',
              'id': 1,
              'method': 'initialize',
              'params': {
                  'protocolVersion': '2024-11-05',
                  'capabilities': {},
                  'clientInfo': {'name': 'inspector-ci', 'version': '1.0'}
              }
          })

          proc.stdin.write(init_msg + '\n')
          proc.stdin.flush()
          time.sleep(2)

          # Send tools/list
          tools_msg = json.dumps({
              'jsonrpc': '2.0',
              'id': 2,
              'method': 'tools/list',
              'params': {}
          })

          proc.stdin.write(tools_msg + '\n')
          proc.stdin.flush()
          time.sleep(2)

          # Read responses
          import select
          output = ''
          while select.select([proc.stdout], [], [], 1)[0]:
              line = proc.stdout.readline()
              if not line:
                  break
              output += line

          proc.terminate()

          # Validate
          responses = [l for l in output.split('\n') if l.strip().startswith('{')]
          if not responses:
              print('FAIL: no JSON responses received')
              sys.exit(1)

          # Check tools/list response
          for r in responses:
              try:
                  data = json.loads(r)
                  if data.get('id') == 2:
                      tools = data.get('result', {}).get('tools', [])
                      print(f'PASS: server listed {len(tools)} tools')
                      if len(tools) > 0:
                          print(f'First tool: {tools[0][\"name\"]}')
                          sys.exit(0)
              except json.JSONDecodeError:
                  continue

          print('FAIL: no tools/list response found')
          sys.exit(1)
          " 2>&1 || echo "Server validation skipped (needs bridge)"
